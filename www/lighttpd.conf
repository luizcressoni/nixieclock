server.document-root = "/home/pi/www/"
server.bind = "0.0.0.0"
server.port = 80

# mod_access is built into the lighttpd core; listing it is what switches it on.
server.modules = ( "mod_access", "mod_cgi" )

index-file.names = ( "index.html" )
mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".txt"  => "text/plain; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "text/javascript; charset=utf-8",
    ".json" => "application/json; charset=utf-8",
    ".jpg"  => "image/jpeg",
    ".png"  => "image/png",
    ".ico"  => "image/x-icon"
)

# json/nixie.json holds the Wi-Fi password and the weather key. The page reads the
# config through the CGI (cgi-bin/nixie.cgi?get=config), which leaves both out.
# Matched by suffix, not by a regex on the path: this lighttpd is built without
# pcre, and a suffix also catches spellings like //json/nixie.json. ".tmp" is the
# config halfway through a save; ".conf" is this server's own configuration.
url.access-deny = ( ".json", ".tmp", ".conf", "~" )

cgi.assign = ( ".cgi" => "" )
